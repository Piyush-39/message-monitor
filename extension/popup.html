<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>IS Message Watchdog</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>IS Message Watchdog</h1>
<p>Check every minute for nine hours. Email new failed messages.</p>
<label for="token">Local email relay key</label>
<input id="token" type="password" placeholder="From npm run setup" autocomplete="off">
<div class="actions"><button id="start">Start 9 hours</button><button id="stop" class="secondary">Stop</button></div>
<button id="open" class="secondary">Open watchdog tab</button>
<button id="test" class="secondary">Send test email</button>
<p id="status" role="status" aria-live="polite">Loading…</p>
<p class="hint">Start from any tenant's Monitor Message Processing page and allow access when Chrome asks. Keep Chrome and the relay running. Sign in again in the watchdog tab if monitoring pauses.</p>
<script type="module" src="popup.js"></script></body></html>
